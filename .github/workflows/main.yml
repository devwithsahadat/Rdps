name: Free Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 # সর্বোচ্চ ৬ ঘণ্টা পর্যন্ত চালু থাকবে

    steps:
    - name: 1. Displaying System Info
      run: |
        Write-Host "Setting up Windows RDP Environment..."

    - name: 2. Enabling RDP in Windows Registry
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Write-Host "RDP Enabled successfully!"

    - name: 3. Setting Password for Existing Admin User
      run: |
        $user = "runneradmin"
        $pass = "P@ssw0rd2026#RDP"
        net user $user $pass
        Write-Host "Password set successfully for user: $user"

    - name: 4. Downloading and Starting Ngrok
      run: |
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-windows-amd64.zip" -OutFile "ngrok.zip"
        Expand-Archive ngrok.zip -DestinationPath .
        ./ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        Start-Process ./ngrok -ArgumentList "tcp 3389"
        Write-Host "Waiting for Ngrok to initialize..."
        Start-Sleep -Seconds 10

    - name: 5. Getting Ngrok TCP Address
      run: |
        $maxRetries = 15
        $retryDelay = 3
        $tcpUrl = $null

        for ($i = 1; $i -le $maxRetries; $i++) {
            try {
                $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
                $tcpUrl = $response.tunnels[0].public_url
                if ($tcpUrl) { break }
            } catch {
                Write-Host "Attempt $i/$maxRetries: Ngrok API not ready yet, waiting..."
                Start-Sleep -Seconds $retryDelay
            }
        }

        if (-not $tcpUrl) {
            Write-Error "Failed to retrieve Ngrok tunnel URL."
            exit 1
        }

        Write-Host "=========================================="
        Write-Host "RDP Connection Address: $tcpUrl" -ForegroundColor Green
        Write-Host "Username: runneradmin" -ForegroundColor Yellow
        Write-Host "Password: P@ssw0rd2026#RDP" -ForegroundColor Yellow
        Write-Host "=========================================="

    - name: 6. Keeping Session Alive
      run: |
        Write-Host "RDP is running. Do not close this workflow tab!"
        for ($i = 0; $i -lt 360; $i++) {
            Start-Sleep -Seconds 60
        }
